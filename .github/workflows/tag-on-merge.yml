name: Tag on PR Merge

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  actions: write

jobs:
  tag:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tachyon-dist-tools
        env:
          DIST_TOOLS_VERSION: ${{ vars.DIST_TOOLS_VERSION || '1.0.3' }}
        run: |
          set -euo pipefail
          pip install "https://github.com/particle-iot/tachyon-dist-tools/releases/download/${DIST_TOOLS_VERSION}/tachyon_dist_tools-${DIST_TOOLS_VERSION}-py3-none-any.whl"

      - name: Determine bump type
        id: bump
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          BUMP="patch"
          LABELS="$PR_LABELS"
          if echo "$LABELS" | jq -e 'any(. == "release:major")' >/dev/null 2>&1; then
            BUMP="major"
          elif echo "$LABELS" | jq -e 'any(. == "release:minor")' >/dev/null 2>&1; then
            BUMP="minor"
          fi
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

      - name: Create version tag
        id: tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP: ${{ steps.bump.outputs.bump }}
        run: |
          set -euo pipefail

          if [[ "$BUMP" == "patch" ]]; then
            VERSION=$(tachyon-resolve-version --build-type release --create-tag)
          else
            # tachyon-resolve-version only auto-bumps patch; major/minor need manual computation
            LATEST_TAG="$(git tag -l '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)"
            LATEST_TAG="${LATEST_TAG:-0.0.0}"
            BASE="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
            case "$BUMP" in
              major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0;;
              minor) MINOR=$((MINOR+1)); PATCH=0;;
            esac
            VERSION="${MAJOR}.${MINOR}.${PATCH}"

            if git rev-parse "refs/tags/${VERSION}" >/dev/null 2>&1; then
              echo "Tag ${VERSION} already exists; skipping."
              exit 0
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${VERSION}" -m "Release ${VERSION}"
            git push origin "${VERSION}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Tagged: ${VERSION}"

      - name: Trigger release build
        if: steps.tag.outputs.version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          echo "Triggering build workflow for tag ${VERSION}"
          gh workflow run build.yml --ref "${VERSION}"
