name: Release QLI on PR Merge

on:
  pull_request:
    branches: [qli-2.0]
    types: [closed]

permissions:
  contents: write
  actions: write

concurrency:
  group: qli-2.0-release-tag
  cancel-in-progress: false

jobs:
  tag:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'qli-2.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Create QLI release tag
        id: tag
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          git fetch origin --tags
          BUMP=patch
          if jq -e 'any(. == "release:major")' <<< "$PR_LABELS" >/dev/null; then
            BUMP=major
          elif jq -e 'any(. == "release:minor")' <<< "$PR_LABELS" >/dev/null; then
            BUMP=minor
          fi
          VERSION=$(python3 scripts/qli/release-version.py next --bump "$BUMP")
          TAG="qli-2.0/${VERSION}"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            test "$(git rev-parse "$TAG^{commit}")" = "$(git rev-parse HEAD)"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$TAG" -m "Qualcomm Linux 2.0 ${VERSION}"
            git push origin "refs/tags/$TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN tag pushes do not trigger another workflow automatically.
      - name: Build and publish the tagged Linux images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh workflow run build.yml --ref "$TAG"
