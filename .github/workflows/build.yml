name: Build Tachyon 24.04

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-tachyon
    environment: production
    env:
      UPLOAD_PR_ASSETS:  ${{ vars.UPLOAD_PR_ASSETS  || 'true' }}
      UPLOAD_TAG_ASSETS: ${{ vars.UPLOAD_TAG_ASSETS || 'true' }}
    strategy:
      fail-fast: false
      matrix:
        region: [RoW, NA]
        variant: [desktop]

    steps:
      - name: Free up disk space
        run: |
          echo "Before:"; df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          echo "After:"; df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need tags/commits for versioning

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tachyon-dist-tools
        run: |
          set -euo pipefail
          DIST_TOOLS_VERSION="${{ vars.DIST_TOOLS_VERSION || '1.0.3' }}"
          pip install "https://github.com/particle-iot/tachyon-dist-tools/releases/download/${DIST_TOOLS_VERSION}/tachyon_dist_tools-${DIST_TOOLS_VERSION}-py3-none-any.whl"

      - name: Determine version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=$(tachyon-resolve-version --build-type release)
            IS_RELEASE="true"
          else
            SHORT_SHA="$(git rev-parse --short=7 HEAD)"
            VERSION=$(tachyon-resolve-version --build-type prerelease --build-id "build.${SHORT_SHA}")
            IS_RELEASE="false"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_release=${IS_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION} (is_release=${IS_RELEASE})"

      - name: Build (Ubuntu 24.04)
        id: build_step
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          OUTNAME="tachyon-ubuntu-24.04-${{ matrix.region }}-${{ matrix.variant }}-${{ steps.ver.outputs.version }}.zip"

          make build_24.04 \
            VERSIONS_FILE=./versions.json \
            INPUT_REGION=${{ matrix.region }} \
            INPUT_VARIANT=${{ matrix.variant }} \
            OUTPUT_VERSION=${{ steps.ver.outputs.version }} \
            OUTPUT_24_04_SYSTEM_IMAGE="${OUTNAME}"

          URL_ENCODED="$(python3 -c "import urllib.parse; print(urllib.parse.quote('${OUTNAME}'))")"
          echo "output_name=${OUTNAME}" >> "$GITHUB_OUTPUT"
          echo "output_path=.tmp/output/${OUTNAME}" >> "$GITHUB_OUTPUT"
          echo "url_encoded_name=${URL_ENCODED}" >> "$GITHUB_OUTPUT"

      - name: Verify artifact exists
        run: |
          ls -lh "${{ steps.build_step.outputs.output_path }}"
          test -s "${{ steps.build_step.outputs.output_path }}"

      # ---------- PR uploads ----------
      - name: Configure AWS (PR)
        if: github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            env.UPLOAD_PR_ASSETS != 'false'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: tachyon-pr-upload-${{ github.run_id }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload PR build to S3
        id: s3_upload_pr
        if: github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            env.UPLOAD_PR_ASSETS != 'false'
        env:
          S3_BUCKET: ${{ secrets.LINUX_DIST_S3_BUCKET }}
          OBJ_KEY: "prerelease/${{ steps.build_step.outputs.output_name }}"
        run: |
          aws s3 cp "${{ steps.build_step.outputs.output_path }}" "s3://${S3_BUCKET}/${OBJ_KEY}" --only-show-errors
          echo "s3_uri=s3://${S3_BUCKET}/${OBJ_KEY}" >> "$GITHUB_OUTPUT"

      - name: Comment with download link
        if: steps.build_step.outputs.output_name &&
          github.event_name == 'pull_request' &&
          env.UPLOAD_PR_ASSETS != 'false'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            **PR build uploaded** for **${{ matrix.region }} ${{ matrix.variant }}**
            **Version:** `${{ steps.ver.outputs.version }}`
            **Download:** [URL](https://linux-dist.particle.io/prerelease/${{ steps.build_step.outputs.url_encoded_name }})

      - name: Invalidate CloudFront (optional for PR)
        if: steps.s3_upload_pr.outputs.s3_uri &&
            env.UPLOAD_PR_ASSETS != 'false'
        env:
          CF_DIST_ID: ${{ secrets.LINUX_DIST_CLOUDFRONT_DISTRIBUTION_ID }}
          INVALIDATION_PATHS: "/prerelease/${{ steps.build_step.outputs.output_name }}"
        run: |
          if [ -n "${CF_DIST_ID}" ]; then
            aws cloudfront create-invalidation --distribution-id "$CF_DIST_ID" --paths "$INVALIDATION_PATHS"
          else
            echo "CF_DIST_ID not set; skipping invalidation."
          fi

      # ---------- Tag uploads (permanent) ----------
      - name: Configure AWS (tag)
        if: steps.ver.outputs.is_release == 'true' &&
            env.UPLOAD_TAG_ASSETS != 'false'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: tachyon-tag-upload-${{ github.run_id }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload tag build to S3 (permanent)
        id: s3_upload_tag
        if: steps.ver.outputs.is_release == 'true' &&
            env.UPLOAD_TAG_ASSETS != 'false'
        env:
          S3_BUCKET: ${{ secrets.LINUX_DIST_S3_BUCKET }}
          OBJ_KEY: "releases/${{ steps.ver.outputs.version }}/${{ matrix.region }}/${{ steps.build_step.outputs.output_name }}"
        run: |
          aws s3 cp "${{ steps.build_step.outputs.output_path }}" "s3://${S3_BUCKET}/${OBJ_KEY}" --only-show-errors
          echo "s3_uri=s3://${S3_BUCKET}/${OBJ_KEY}" >> "$GITHUB_OUTPUT"
          echo "obj_key=${OBJ_KEY}" >> "$GITHUB_OUTPUT"

      - name: Invalidate CloudFront (tags)
        if: steps.s3_upload_tag.outputs.s3_uri && env.UPLOAD_TAG_ASSETS != 'false'
        env:
          CF_DIST_ID: ${{ secrets.LINUX_DIST_CLOUDFRONT_DISTRIBUTION_ID }}
          INVALIDATION_PATHS: "/releases/${{ steps.ver.outputs.version }}/${{ matrix.region }}/${{ steps.build_step.outputs.output_name }}"
        run: |
          if [ -n "${CF_DIST_ID}" ]; then
            aws cloudfront create-invalidation --distribution-id "$CF_DIST_ID" --paths "$INVALIDATION_PATHS"
          else
            echo "CF_DIST_ID not set; skipping invalidation."
          fi

      - name: Compute SHA256 (tag builds)
        id: sha
        if: steps.ver.outputs.is_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(sha256sum "${{ steps.build_step.outputs.output_path }}" | awk '{print $1}')"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      # Emit tiny region metadata and upload as a shared artifact (for the release job to aggregate)
      - name: Publish region metadata (for release job)
        if: steps.s3_upload_tag.outputs.s3_uri
        run: |
          mkdir -p release_meta
          cat > release_meta/${{ matrix.region }}-${{ matrix.variant }}.txt <<EOF
          REGION=${{ matrix.region }}
          VARIANT=${{ matrix.variant }}
          VERSION=${{ steps.ver.outputs.version }}
          FILE=${{ steps.build_step.outputs.output_name }}
          S3_KEY=${{ steps.s3_upload_tag.outputs.obj_key }}
          S3_URI=s3://${{ secrets.LINUX_DIST_S3_BUCKET }}/${{ steps.s3_upload_tag.outputs.obj_key }}
          SHA256=${{ steps.sha.outputs.sha }}
          EOF

      - name: Upload release metadata artifact
        if: steps.s3_upload_tag.outputs.s3_uri
        uses: actions/upload-artifact@v4
        with:
          # 👇 unique name per matrix region/variant to avoid conflicts
          name: release-metadata-${{ matrix.region }}-${{ matrix.variant }}
          path: release_meta/*.txt
          if-no-files-found: ignore
          retention-days: 3

  publish_release:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      id-token: write
    # ✅ Only run after successful matrix AND not on PRs; allow tag push or the tag workflow-run
    if: ${{ needs.build.result == 'success'
           && github.event_name != 'pull_request'
           && startsWith(github.ref, 'refs/tags/') }}
    env:
      # make these shell envs available to all steps
      LINUX_DIST_S3_BUCKET: ${{ secrets.LINUX_DIST_S3_BUCKET }}
      AWS_REGION:           ${{ secrets.AWS_REGION }}
      RELEASE_METADATA_KEY: ${{ vars.RELEASE_METADATA_KEY || 'meta/tachyon-latest.json' }}
      # NOTE: ensure this matches your public CDN route (singular vs plural).
      PUBLIC_RELEASE_BASE_URL: ${{ vars.PUBLIC_RELEASE_BASE_URL || 'https://linux-dist.particle.io/release' }}
      PUSH_JSON:            ${{ vars.PUSH_JSON || 'false' }}
    steps:
      - name: Configure AWS for metadata read/write
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: tachyon-metadata-${{ github.run_id }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tachyon-dist-tools
        run: |
          set -euo pipefail
          DIST_TOOLS_VERSION="${{ vars.DIST_TOOLS_VERSION || '1.0.3' }}"
          WHEEL_URL="https://github.com/particle-iot/tachyon-dist-tools/releases/download/${DIST_TOOLS_VERSION}/tachyon_dist_tools-${DIST_TOOLS_VERSION}-py3-none-any.whl"
          pip install "$WHEEL_URL"
          echo "Installed tachyon-dist-tools ${DIST_TOOLS_VERSION}"
          tachyon-json-validator --help >/dev/null 2>&1

      - name: Verify S3 access (debug)
        run: |
          set -euo pipefail
          KEY="${RELEASE_METADATA_KEY:-meta/tachyon-latest.json}"
          echo "Key:    $KEY"
          echo "== head-object =="
          if ! aws s3api head-object --bucket "$LINUX_DIST_S3_BUCKET" --key "$KEY"; then
            echo "::error:: head-object failed (exit $?)"
            exit 1
          fi
          echo "== ls (prefix) =="
          aws s3 ls "s3://${LINUX_DIST_S3_BUCKET}/meta/" || true

      # --- Ensure artifact dir exists before download to avoid 'No such file or directory'
      - name: Prepare artifact folder
        run: mkdir -p release_meta

      - name: Download aggregated release metadata
        uses: actions/download-artifact@v4
        with:
          pattern: release-metadata-*
          path: release_meta
          merge-multiple: true

      - name: Ensure both regions produced metadata
        run: |
          set -euo pipefail
          ls -l release_meta || true
          test -f release_meta/NA-desktop.txt # adjust if more variants added
          test -f release_meta/RoW-desktop.txt # adjust if more variants added

      - name: Resolve version
        id: versel
        run: |
          set -euo pipefail
          VERSION=$(tachyon-resolve-version --build-type release)
          PREV=$(tachyon-resolve-version --build-type release --get-previous-version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build changelog from PRs
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          fromTag: ${{ steps.versel.outputs.prev }}
          toTag:   ${{ steps.versel.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute contributors between tags
        id: contribs
        run: |
          set -euo pipefail
          FROM="${{ steps.versel.outputs.prev }}"
          TO="${{ steps.versel.outputs.version }}"

          if [[ -z "$FROM" ]]; then
            RANGE="$TO"
          else
            RANGE="$FROM..$TO"
          fi

          git fetch --quiet --tags --force

          MAP="$(git shortlog -sne $RANGE || true)"
          if [[ -z "$MAP" ]]; then
            LIST="(none)"
          else
            LIST="$(echo "$MAP" | sed -E 's/^[[:space:]]*([0-9]+)[[:space:]]+(.+) <.*>/- \2 (\1 commits)/')"
          fi

          {
            echo 'contributors<<EOF'
            echo "$LIST"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Assemble and validate release metadata
        run: |
          set -euo pipefail
          VERSION="${{ steps.versel.outputs.version }}"
          NOW="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          BASE_URL="${PUBLIC_RELEASE_BASE_URL}"

          for TXTFILE in release_meta/*.txt; do
            eval "$(sed 's/^[[:space:]]*//' "$TXTFILE")"
            BASENAME="$(basename "$TXTFILE" .txt)"
            URL="${BASE_URL}/${VERSION}/${REGION}/${FILE}"

            jq -n --arg ver "$VERSION" --arg now "$NOW" --arg url "$URL" \
              --arg sha "$SHA256" --arg variant "$VARIANT" --arg region "$REGION" \
              '{
                release_name: ("tachyon-ubuntu-24.04-" + $region + "-" + $variant + "-" + $ver),
                version: $ver, region: $region, variant: $variant,
                platform: "qcm6490", board: "formfactor_dvt",
                os: "linux", distribution: "ubuntu",
                distribution_version: "24.04", distribution_variant: "ubuntu",
                build_date: $now,
                artifacts: [{ artifact_url: $url, sha256_checksum: $sha, type: "release_image" }]
              }' > "release_meta/${BASENAME}.json"
          done

          jq -n --arg schema "https://linux-dist.particle.io/schema/release_metadata_v1.json" \
            --slurpfile builds <(jq -s '.' release_meta/*.json) \
            '{ "$schema": $schema, "builds": $builds[0] }' > release_metadata.json

          tachyon-json-validator release_metadata.json
          echo "Release metadata:"
          jq -C . release_metadata.json

      - name: Build release body
        id: body
        run: |
          set -euo pipefail
          VERSION="${{ steps.versel.outputs.version }}"
          PREV="${{ steps.versel.outputs.prev }}"

          # Generate images section from release metadata
          tachyon-gh-note-builder release_metadata.json -o images_section.md

          CLEAN_CHANGES="$(printf '%s\n' "${{ steps.changelog.outputs.changelog }}" \
            | sed -E '/^##[[:space:]].*$/d')"

          {
            echo "${VERSION}"
            echo
            cat images_section.md
            echo
            echo "## What's Changed"
            echo
            if [ -z "$(printf '%s' "$CLEAN_CHANGES" | sed '/^[[:space:]]*$/d')" ]; then
              echo "- No categorized changes"
            else
              printf '%s\n' "$CLEAN_CHANGES"
            fi
            echo
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV:-0.0.0}...${VERSION}"
            echo
            echo "Contributors"
            echo "${{ steps.contribs.outputs.contributors }}"
          } > RELEASE_BODY.md

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versel.outputs.version }}
          name: ${{ steps.versel.outputs.version }}
          body_path: RELEASE_BODY.md
          draft: false
          prerelease: ${{ contains(steps.versel.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update S3 release metadata
        if: env.PUSH_JSON == 'true'
        run: |
          set -euo pipefail
          tachyon-update-published-metadata \
            "$LINUX_DIST_S3_BUCKET" \
            "${RELEASE_METADATA_KEY}" \
            release_metadata.json \
            --origin "24.04"

      - name: S3 metadata (dry run)
        if: env.PUSH_JSON != 'true'
        run: echo "PUSH_JSON != 'true' -- dry run, nothing pushed to S3."