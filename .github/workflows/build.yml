name: Build Tachyon 24.04

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-tachyon
    timeout-minutes: 90
    environment: production
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
      is_release: ${{ steps.ver.outputs.is_release }}
    env:
      UPLOAD_PR_ASSETS:  ${{ vars.UPLOAD_PR_ASSETS  || 'true' }}
      UPLOAD_TAG_ASSETS: ${{ vars.UPLOAD_TAG_ASSETS || 'true' }}
    strategy:
      fail-fast: false
      matrix:
        region: [RoW, NA]
        variant: [headless, desktop]

    steps:
      - name: Free up disk space
        run: |
          echo "Before:"; df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          echo "After:"; df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need tags/commits for versioning

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tachyon-dist-tools
        env:
          DIST_TOOLS_VERSION: ${{ vars.DIST_TOOLS_VERSION || '1.0.3' }}
        run: |
          set -euo pipefail
          pip install "https://github.com/particle-iot/tachyon-dist-tools/releases/download/${DIST_TOOLS_VERSION}/tachyon_dist_tools-${DIST_TOOLS_VERSION}-py3-none-any.whl"

      - name: Determine version
        id: ver
        shell: bash
        env:
          GH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$GH_REF" == refs/tags/* ]]; then
            VERSION=$(tachyon-resolve-version --build-type release)
            IS_RELEASE="true"
          else
            SHORT_SHA="$(git rev-parse --short=7 HEAD)"
            VERSION=$(tachyon-resolve-version --build-type prerelease --build-id "build.${SHORT_SHA}")
            IS_RELEASE="false"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_release=${IS_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION} (is_release=${IS_RELEASE})"

      - name: Build (Ubuntu 24.04)
        id: build_step
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          REGION: ${{ matrix.region }}
          VARIANT: ${{ matrix.variant }}
          # fetch_kigen_sdk pulls lpa-linux-arm64 from the private
          # particle-iot-inc/kigen-sdk repo on the host (the overlay container has no
          # credentials). KIGEN_SDK_TOKEN must be a PAT/app token with read access to its
          # releases -- the automatic GITHUB_TOKEN cannot read another org's repo.
          # Passed as KIGEN_SDK_TOKEN rather than GH_TOKEN on purpose: forcing GH_TOKEN
          # would clobber any working `gh auth login` on the self-hosted runner, and an
          # empty value would break auth outright. The Makefile only exports GH_TOKEN
          # when a non-empty token is actually present.
          KIGEN_SDK_TOKEN: ${{ secrets.KIGEN_SDK_TOKEN }}
        run: |
          set -euo pipefail
          OUTNAME="tachyon-ubuntu-24.04-${REGION}-${VARIANT}-${VERSION}.zip"

          make build_24.04 \
            VERSIONS_FILE=./versions.json \
            INPUT_REGION="${REGION}" \
            INPUT_VARIANT="${VARIANT}" \
            OUTPUT_VERSION="${VERSION}" \
            OUTPUT_24_04_SYSTEM_IMAGE="${OUTNAME}"

          URL_ENCODED="$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "$OUTNAME")"
          echo "output_name=${OUTNAME}" >> "$GITHUB_OUTPUT"
          echo "output_path=.tmp/output/${OUTNAME}" >> "$GITHUB_OUTPUT"
          echo "url_encoded_name=${URL_ENCODED}" >> "$GITHUB_OUTPUT"

      - name: Verify artifact exists
        env:
          OUTPUT_PATH: ${{ steps.build_step.outputs.output_path }}
        run: |
          ls -lh "$OUTPUT_PATH"
          test -s "$OUTPUT_PATH"

      # ---------- PR uploads ----------
      - name: Configure AWS (PR)
        if: github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            env.UPLOAD_PR_ASSETS != 'false'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: tachyon-pr-upload-${{ github.run_id }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload PR build to S3
        id: s3_upload_pr
        if: github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            env.UPLOAD_PR_ASSETS != 'false'
        env:
          S3_BUCKET: ${{ secrets.LINUX_DIST_S3_BUCKET }}
          OBJ_KEY: "prerelease/${{ steps.build_step.outputs.output_name }}"
          OUTPUT_PATH: ${{ steps.build_step.outputs.output_path }}
        run: |
          aws s3 cp "$OUTPUT_PATH" "s3://${S3_BUCKET}/${OBJ_KEY}" --only-show-errors
          echo "s3_uri=s3://${S3_BUCKET}/${OBJ_KEY}" >> "$GITHUB_OUTPUT"

      - name: Comment with download link
        if: steps.build_step.outputs.output_name &&
          github.event_name == 'pull_request' &&
          env.UPLOAD_PR_ASSETS != 'false'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            **PR build uploaded** for **${{ matrix.region }} ${{ matrix.variant }}**
            **Version:** `${{ steps.ver.outputs.version }}`
            **Download:** [URL](https://linux-dist.particle.io/prerelease/${{ steps.build_step.outputs.url_encoded_name }})

      - name: Invalidate CloudFront (optional for PR)
        if: steps.s3_upload_pr.outputs.s3_uri &&
            env.UPLOAD_PR_ASSETS != 'false'
        env:
          CF_DIST_ID: ${{ secrets.LINUX_DIST_CLOUDFRONT_DISTRIBUTION_ID }}
          INVALIDATION_PATHS: "/prerelease/${{ steps.build_step.outputs.output_name }}"
        run: |
          if [ -n "${CF_DIST_ID}" ]; then
            aws cloudfront create-invalidation --distribution-id "$CF_DIST_ID" --paths "$INVALIDATION_PATHS"
          else
            echo "CF_DIST_ID not set; skipping invalidation."
          fi

      # ---------- Tag uploads (permanent) ----------
      - name: Configure AWS (tag)
        if: steps.ver.outputs.is_release == 'true' &&
            env.UPLOAD_TAG_ASSETS != 'false'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: tachyon-tag-upload-${{ github.run_id }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload tag build to S3 (permanent)
        id: s3_upload_tag
        if: steps.ver.outputs.is_release == 'true' &&
            env.UPLOAD_TAG_ASSETS != 'false'
        env:
          S3_BUCKET: ${{ secrets.LINUX_DIST_S3_BUCKET }}
          OBJ_KEY: "releases/${{ steps.ver.outputs.version }}/${{ matrix.region }}/${{ steps.build_step.outputs.output_name }}"
          OUTPUT_PATH: ${{ steps.build_step.outputs.output_path }}
        run: |
          aws s3 cp "$OUTPUT_PATH" "s3://${S3_BUCKET}/${OBJ_KEY}" --only-show-errors
          echo "s3_uri=s3://${S3_BUCKET}/${OBJ_KEY}" >> "$GITHUB_OUTPUT"
          echo "obj_key=${OBJ_KEY}" >> "$GITHUB_OUTPUT"

      - name: Invalidate CloudFront (tags)
        if: steps.s3_upload_tag.outputs.s3_uri && env.UPLOAD_TAG_ASSETS != 'false'
        env:
          CF_DIST_ID: ${{ secrets.LINUX_DIST_CLOUDFRONT_DISTRIBUTION_ID }}
          INVALIDATION_PATHS: "/releases/${{ steps.ver.outputs.version }}/${{ matrix.region }}/${{ steps.build_step.outputs.output_name }}"
        run: |
          if [ -n "${CF_DIST_ID}" ]; then
            aws cloudfront create-invalidation --distribution-id "$CF_DIST_ID" --paths "$INVALIDATION_PATHS"
          else
            echo "CF_DIST_ID not set; skipping invalidation."
          fi

      - name: Compute SHA256
        id: sha
        shell: bash
        env:
          OUTPUT_PATH: ${{ steps.build_step.outputs.output_path }}
        run: |
          set -euo pipefail
          SHA="$(sha256sum "$OUTPUT_PATH" | awk '{print $1}')"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      # Emit region metadata for every successful build (consumed by publish_metadata job)
      - name: Publish region metadata
        if: steps.s3_upload_tag.outputs.s3_uri || steps.s3_upload_pr.outputs.s3_uri
        env:
          IS_RELEASE: ${{ steps.ver.outputs.is_release }}
          VERSION: ${{ steps.ver.outputs.version }}
          REGION: ${{ matrix.region }}
          VARIANT: ${{ matrix.variant }}
          OUTPUT_NAME: ${{ steps.build_step.outputs.output_name }}
          S3_BUCKET: ${{ secrets.LINUX_DIST_S3_BUCKET }}
          SHA256: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p release_meta
          if [[ "$IS_RELEASE" == "true" ]]; then
            S3_KEY="releases/${VERSION}/${REGION}/${OUTPUT_NAME}"
          else
            S3_KEY="prerelease/${OUTPUT_NAME}"
          fi
          cat > "release_meta/${REGION}-${VARIANT}.txt" <<EOF
          REGION=${REGION}
          VARIANT=${VARIANT}
          VERSION=${VERSION}
          IS_RELEASE=${IS_RELEASE}
          FILE=${OUTPUT_NAME}
          S3_KEY=${S3_KEY}
          S3_URI=s3://${S3_BUCKET}/${S3_KEY}
          SHA256=${SHA256}
          EOF

      - name: Upload build metadata artifact
        if: steps.s3_upload_tag.outputs.s3_uri || steps.s3_upload_pr.outputs.s3_uri
        uses: actions/upload-artifact@v4
        with:
          name: build-metadata-${{ matrix.region }}-${{ matrix.variant }}
          path: release_meta/*.txt
          if-no-files-found: ignore
          retention-days: 3

  # ── Per-version metadata (all builds except fork PRs) ──────────────────
  publish_metadata:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    if: >-
      needs.build.result == 'success'
      && !(github.event_name == 'pull_request'
           && github.event.pull_request.head.repo.full_name != github.repository)
    env:
      LINUX_DIST_S3_BUCKET: ${{ secrets.LINUX_DIST_S3_BUCKET }}
      AWS_REGION:           ${{ secrets.AWS_REGION }}
      PUBLIC_RELEASE_BASE_URL:    ${{ vars.PUBLIC_RELEASE_BASE_URL    || 'https://linux-dist.particle.io/release' }}
      PUBLIC_PRERELEASE_BASE_URL: ${{ vars.PUBLIC_PRERELEASE_BASE_URL || 'https://linux-dist.particle.io/prerelease' }}
    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: tachyon-metadata-${{ github.run_id }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tachyon-dist-tools
        env:
          DIST_TOOLS_VERSION: ${{ vars.DIST_TOOLS_VERSION || '1.0.3' }}
        run: |
          set -euo pipefail
          pip install "https://github.com/particle-iot/tachyon-dist-tools/releases/download/${DIST_TOOLS_VERSION}/tachyon_dist_tools-${DIST_TOOLS_VERSION}-py3-none-any.whl"

      - name: Download build metadata artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-metadata-*
          path: build_meta
          merge-multiple: true

      - name: Ensure all region/variant builds produced metadata
        run: |
          set -euo pipefail
          ls -l build_meta/
          test -f build_meta/NA-headless.txt
          test -f build_meta/NA-desktop.txt
          test -f build_meta/RoW-headless.txt
          test -f build_meta/RoW-desktop.txt

      - name: Assemble and validate metadata
        id: assemble
        env:
          VERSION: ${{ needs.build.outputs.version }}
          IS_RELEASE: ${{ needs.build.outputs.is_release }}
        run: |
          set -euo pipefail
          NOW="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          for TXTFILE in build_meta/*.txt; do
            eval "$(sed 's/^[[:space:]]*//' "$TXTFILE")"
            BASENAME="$(basename "$TXTFILE" .txt)"

            ENCODED_FILE="$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "$FILE")"
            if [[ "$IS_RELEASE" == "true" ]]; then
              URL="${PUBLIC_RELEASE_BASE_URL}/${VERSION}/${REGION}/${ENCODED_FILE}"
            else
              URL="${PUBLIC_PRERELEASE_BASE_URL}/${ENCODED_FILE}"
            fi

            jq -n --arg ver "$VERSION" --arg now "$NOW" --arg url "$URL" \
              --arg sha "$SHA256" --arg variant "$VARIANT" --arg region "$REGION" \
              '{
                release_name: ("tachyon-ubuntu-24.04-" + $region + "-" + $variant + "-" + $ver),
                version: $ver, region: $region, variant: $variant,
                platform: "qcm6490", board: "formfactor_dvt",
                os: "linux", distribution: "ubuntu",
                distribution_version: "24.04", distribution_variant: "ubuntu",
                build_date: $now,
                artifacts: [{ artifact_url: $url, sha256_checksum: $sha, type: "release_image" }]
              }' > "build_meta/${BASENAME}.json"
          done

          jq -n --arg schema "https://linux-dist.particle.io/schema/release_metadata_v1.json" \
            --slurpfile builds <(jq -s '.' build_meta/*.json) \
            '{ "$schema": $schema, "builds": $builds[0] }' > release_metadata.json

          tachyon-json-validator release_metadata.json
          echo "Metadata:"
          jq -C . release_metadata.json
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_release=${IS_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "metadata_key=meta/tachyon-${VERSION}.json" >> "$GITHUB_OUTPUT"

      - name: Upload per-version metadata to S3
        env:
          METADATA_KEY: ${{ steps.assemble.outputs.metadata_key }}
          IS_RELEASE: ${{ steps.assemble.outputs.is_release }}
        run: |
          set -euo pipefail
          aws s3 cp release_metadata.json \
            "s3://${LINUX_DIST_S3_BUCKET}/${METADATA_KEY}" \
            --only-show-errors

          if [[ "$IS_RELEASE" != "true" ]]; then
            aws s3api put-object-tagging \
              --bucket "$LINUX_DIST_S3_BUCKET" \
              --key "$METADATA_KEY" \
              --tagging 'TagSet=[{Key=lifecycle,Value=prerelease}]'
            echo "Tagged ${METADATA_KEY} with lifecycle=prerelease"
          fi

      - name: Invalidate CloudFront for metadata
        env:
          CF_DIST_ID: ${{ secrets.LINUX_DIST_CLOUDFRONT_DISTRIBUTION_ID }}
          METADATA_KEY: ${{ steps.assemble.outputs.metadata_key }}
        run: |
          set -euo pipefail
          if [ -n "${CF_DIST_ID:-}" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "$CF_DIST_ID" \
              --paths "/${METADATA_KEY}"
          else
            echo "CF_DIST_ID not set; skipping invalidation."
          fi

      - name: Upload metadata as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata-json
          path: release_metadata.json
          retention-days: 30

  # ── GitHub Release + latest.json (tag builds only) ───────────────────
  publish_release:
    needs: [build, publish_metadata]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: write
      id-token: write
    if: >-
      needs.build.result == 'success'
      && needs.publish_metadata.result == 'success'
      && needs.build.outputs.is_release == 'true'
    env:
      LINUX_DIST_S3_BUCKET: ${{ secrets.LINUX_DIST_S3_BUCKET }}
      AWS_REGION:           ${{ secrets.AWS_REGION }}
      RELEASE_METADATA_KEY: ${{ vars.RELEASE_METADATA_KEY || 'meta/tachyon-latest.json' }}
      PUSH_JSON:            ${{ vars.PUSH_JSON || 'false' }}
    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: tachyon-release-${{ github.run_id }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tachyon-dist-tools
        env:
          DIST_TOOLS_VERSION: ${{ vars.DIST_TOOLS_VERSION || '1.0.3' }}
        run: |
          set -euo pipefail
          pip install "https://github.com/particle-iot/tachyon-dist-tools/releases/download/${DIST_TOOLS_VERSION}/tachyon_dist_tools-${DIST_TOOLS_VERSION}-py3-none-any.whl"

      - name: Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-metadata-json
          path: .

      - name: Resolve previous version
        id: versel
        run: |
          set -euo pipefail
          PREV=$(tachyon-resolve-version --build-type release --get-previous-version)
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"

      - name: Build changelog from PRs
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          fromTag: ${{ steps.versel.outputs.prev }}
          toTag:   ${{ needs.build.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute contributors between tags
        id: contribs
        env:
          FROM_TAG: ${{ steps.versel.outputs.prev }}
          TO_TAG: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          FROM="$FROM_TAG"
          TO="$TO_TAG"

          if [[ -z "$FROM" ]]; then
            RANGE="$TO"
          else
            RANGE="$FROM..$TO"
          fi

          git fetch --quiet --tags --force

          MAP="$(git shortlog -sne $RANGE || true)"
          if [[ -z "$MAP" ]]; then
            LIST="(none)"
          else
            LIST="$(echo "$MAP" | sed -E 's/^[[:space:]]*([0-9]+)[[:space:]]+(.+) <.*>/- \2 (\1 commits)/')"
          fi

          {
            echo 'contributors<<EOF'
            echo "$LIST"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build release body
        id: body
        env:
          VERSION: ${{ needs.build.outputs.version }}
          PREV: ${{ steps.versel.outputs.prev }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
          GH_REPO: ${{ github.repository }}
          CONTRIBUTORS: ${{ steps.contribs.outputs.contributors }}
        run: |
          set -euo pipefail
          tachyon-gh-note-builder release_metadata.json -o images_section.md

          CLEAN_CHANGES="$(printf '%s\n' "$CHANGELOG" \
            | sed -E '/^##[[:space:]].*$/d')"

          {
            echo "${VERSION}"
            echo
            cat images_section.md
            echo
            echo "## What's Changed"
            echo
            if [ -z "$(printf '%s' "$CLEAN_CHANGES" | sed '/^[[:space:]]*$/d')" ]; then
              echo "- No categorized changes"
            else
              printf '%s\n' "$CLEAN_CHANGES"
            fi
            echo
            echo "**Full Changelog**: https://github.com/${GH_REPO}/compare/${PREV:-0.0.0}...${VERSION}"
            echo
            echo "Contributors"
            echo "$CONTRIBUTORS"
          } > RELEASE_BODY.md

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: ${{ needs.build.outputs.version }}
          body_path: RELEASE_BODY.md
          draft: false
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update S3 release metadata (latest.json)
        if: env.PUSH_JSON == 'true'
        run: |
          set -euo pipefail
          tachyon-update-published-metadata \
            "$LINUX_DIST_S3_BUCKET" \
            "${RELEASE_METADATA_KEY}" \
            release_metadata.json \
            --origin "24.04"

      # ----------------------------------------------------------------------
      # `latest` is now simply whatever this release published. The step above
      # is its only writer: tachyon-update-published-metadata replaces every
      # entry with distribution_version == "24.04" with this build's four
      # images (NA/RoW x headless/desktop, real sha256 checksums) and leaves
      # every other distribution -- 20.04, android -- untouched.
      #
      # This replaces the 1.1.43 pin that used to force-overwrite the entries
      # this step had just written, so the 1.2.x line was never served as the
      # default. Two consequences worth knowing: the CLI now offers 1.2.x by
      # default, and a 24.04 headless image appears in `latest` for the first
      # time (1.1.43 shipped desktop only).
      # ----------------------------------------------------------------------
      - name: Invalidate CloudFront (latest.json)
        if: env.PUSH_JSON == 'true'
        env:
          CF_DIST_ID: ${{ secrets.LINUX_DIST_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          if [ -n "${CF_DIST_ID:-}" ]; then
            aws cloudfront create-invalidation --distribution-id "$CF_DIST_ID" \
              --paths "/${RELEASE_METADATA_KEY}"
          else
            echo "CF_DIST_ID not set; skipping invalidation."
          fi

      # ----------------------------------------------------------------------
      # One-time promotion of the 24.04 `stable` channel off the 1.1.43 pin.
      #
      # `stable` was seeded with 1.1.43 desktop (empty checksums) while 1.2.x
      # was pre-production. Move it to STABLE_PROMOTE_TO exactly once, and
      # only when BOTH of these hold:
      #
      #   * every 24.04 entry in meta/tachyon-stable.json is STABLE_PROMOTE_FROM
      #   * this build IS STABLE_PROMOTE_TO
      #
      # Any other release leaves `stable` alone -- including a later 1.2.x,
      # which has to be promoted deliberately rather than by whichever build
      # happens to run next. The pair of guards also makes this step
      # self-retiring: once `stable` reads 1.2.24 the first can never pass
      # again, so it goes inert and can simply be deleted.
      #
      # Unlike the pin it replaces, the write goes through
      # tachyon-update-published-metadata rather than raw `aws s3 cp -`, so it
      # gets schema validation on the way in and out plus the optimistic-
      # concurrency retry, and it publishes real checksums instead of the
      # empty ones the CLI had to skip verifying.
      # ----------------------------------------------------------------------
      - name: 'Promote 24.04 stable: 1.1.43 -> 1.2.24 (once, or not at all)'
        if: env.PUSH_JSON == 'true'
        env:
          STABLE_KEY: 'meta/tachyon-stable.json'
          STABLE_PROMOTE_FROM: '1.1.43'
          STABLE_PROMOTE_TO: '1.2.24'
          VERSION: ${{ needs.build.outputs.version }}
          CF_DIST_ID: ${{ secrets.LINUX_DIST_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail

          if [[ "$VERSION" != "$STABLE_PROMOTE_TO" ]]; then
            echo "This build is ${VERSION}, not ${STABLE_PROMOTE_TO}; leaving ${STABLE_KEY} untouched."
            exit 0
          fi

          # A missing object is not a reason to create one: this promotion only
          # ever rewrites an existing pin, so a 404 means the world changed
          # under us and stopping is correct.
          if ! aws s3api head-object --bucket "$LINUX_DIST_S3_BUCKET" --key "$STABLE_KEY" >/dev/null 2>&1; then
            echo "ERROR: ${STABLE_KEY} does not exist (or is unreadable); refusing to create it here." >&2
            exit 1
          fi
          CUR="$(aws s3 cp "s3://${LINUX_DIST_S3_BUCKET}/${STABLE_KEY}" -)"

          # `unique` collapses the expected pair of 1.1.43 entries to one value,
          # so a manifest holding a mix of versions reads as already-moved-on
          # and is left alone rather than half-rewritten.
          FOUND="$(printf '%s' "$CUR" | jq -r '
            [.builds[]? | select(.distribution_version == "24.04") | .version] | unique | join(",")')"
          if [[ "$FOUND" != "$STABLE_PROMOTE_FROM" ]]; then
            echo "24.04 in ${STABLE_KEY} is \"${FOUND:-none}\", not the ${STABLE_PROMOTE_FROM} pin; leaving it untouched."
            exit 0
          fi

          echo "Promoting 24.04 in ${STABLE_KEY}: ${STABLE_PROMOTE_FROM} -> ${VERSION}"
          tachyon-update-published-metadata \
            "$LINUX_DIST_S3_BUCKET" \
            "$STABLE_KEY" \
            release_metadata.json \
            --origin "24.04"

          if [ -n "${CF_DIST_ID:-}" ]; then
            aws cloudfront create-invalidation --distribution-id "$CF_DIST_ID" \
              --paths "/${STABLE_KEY}"
          fi

      - name: S3 metadata (dry run)
        if: env.PUSH_JSON != 'true'
        run: echo "PUSH_JSON != 'true' -- dry run, nothing pushed to S3."