# ONE-OFF OPERATION: run this branch manually, then close the PR WITHOUT merging.
# This replaces the build workflow only on this temporary branch.
name: One-off Ubuntu 20.04 stable promotion

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: promote-ubuntu-20-04-stable-once
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/ops/promote-20.04-stable-1.0.193'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      LINUX_DIST_S3_BUCKET: ${{ secrets.LINUX_DIST_S3_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned metadata tools
        run: pip install 'https://github.com/particle-iot/tachyon-dist-tools/releases/download/1.0.4/tachyon_dist_tools-1.0.4-py3-none-any.whl'
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: promote-20-stable-${{ github.run_id }}
      - name: Promote only Ubuntu 20.04 from 1.0.180 to 1.0.193
        run: python scripts/promote_20_04_stable_once.py --apply
      - name: Invalidate stable metadata cache
        env:
          CF_DIST_ID: ${{ secrets.LINUX_DIST_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          if [ -n "${CF_DIST_ID:-}" ]; then
            aws cloudfront create-invalidation --distribution-id "$CF_DIST_ID" \
              --paths '/meta/tachyon-stable.json'
          fi
      - name: Retain before and after metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-20.04-stable-promotion
          path: |
            promotion/stable-before.json
            promotion/stable-proposed.json
            promotion/release-1.0.193.json
          if-no-files-found: ignore
          retention-days: 30
