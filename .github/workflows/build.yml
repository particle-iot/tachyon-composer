name: Build Tachyon 24.04

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    tags:
      - 'v*'           # official release on tags
  workflow_dispatch:

permissions:
  contents: write    # needed for release upload on tag builds

jobs:
  build:
    runs-on: ubuntu-tachyon
    strategy:
      fail-fast: false
      matrix:
        region: [RoW, NA]

    steps:
      - name: Free up disk space
        run: |
          echo "Before:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache
          echo "After:"
          df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need tags to derive versions

      - name: Determine version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          # Base: latest semver-like tag (or '0.0.0' if none)
          BASE_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo 'v0.0.0')"
          BASE_VER="${BASE_TAG#v}"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            SHORTSHA="$(git rev-parse --short=7 ${{ github.sha }})"
            VERSION="${BASE_VER}-${SHORTSHA}"
            MODE="pr"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Official release: strip leading v
            RAW_TAG="${{ github.ref_name }}"
            VERSION="${RAW_TAG#v}"
            MODE="tag"
          else
            # Manual or other: snapshot off current commit
            SHORTSHA="$(git rev-parse --short=7 ${{ github.sha }})"
            VERSION="${BASE_VER}-${SHORTSHA}"
            MODE="other"
          fi

          echo "base_tag=${BASE_TAG}"        >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}"          >> "$GITHUB_OUTPUT"
          echo "mode=${MODE}"                >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION} (mode=${MODE})"

      - name: Show build matrix/config
        run: |
          echo "Region:  ${{ matrix.region }}"
          echo "Variant: desktop"
          echo "Version: ${{ steps.ver.outputs.version }}"
          echo "Mode:    ${{ steps.ver.outputs.mode }}"

      - name: Docker sanity
        run: |
          docker --version
          make doctor

      - name: Build (Ubuntu 24.04)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          OUTPUT_NAME="tachyon-ubuntu-24.04-${{ matrix.region }}-desktop-formfactor_dvt-${VERSION}.zip"
          make build_24.04 \
            VERSIONS_FILE=./versions.json \
            INPUT_REGION=${{ matrix.region }} \
            INPUT_VARIANT=desktop \
            OUTPUT_VERSION=${VERSION} \
            OUTPUT_24_04_SYSTEM_IMAGE="${OUTPUT_NAME}"

          echo "OUTPUT_NAME=${OUTPUT_NAME}" >> $GITHUB_ENV
          echo "OUTPUT_PATH=.tmp/output/${OUTPUT_NAME}" >> $GITHUB_ENV
          ls -lh "$OUTPUT_PATH"

      - name: Upload artifact (only on tag releases)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: tachyon-24.04-${{ matrix.region }}-desktop-${{ steps.ver.outputs.version }}
          path: ${{ env.OUTPUT_PATH }}
          if-no-files-found: error

      - name: Create GitHub Release & attach assets (only on tag releases)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: ${{ env.OUTPUT_PATH }}