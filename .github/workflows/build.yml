name: Build Tachyon QLI 2.0

# QLI owns the qli-2.0/ tag stream, starting at 1.4.0. Ubuntu 24.04
# remains on main (1.2.x), and Ubuntu 26.04 on 26.04 (1.3.x).
# PRs build complete NA/RoW headless Linux images; tags publish releases.

on:
  pull_request:
    branches: [qli-2.0, feature/qli-2.0-bringup]
    types: [opened, synchronize, reopened]
  push:
    branches:
      - 'qli-2.0'
    tags:
      # qli-2.0 releases only. '*' does not cross '/', so bare 24.04 tags never match.
      - 'qli-2.0/[0-9]+.[0-9]+.[0-9]+'
      - 'qli-2.0/[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

concurrency:
  group: qli-build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ${{ vars.QLI_BUILD_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 90
    environment: production
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
      is_release: ${{ steps.ver.outputs.is_release }}
    env:
      UPLOAD_PR_ASSETS:  ${{ vars.UPLOAD_PR_ASSETS  || 'true' }}
      UPLOAD_TAG_ASSETS: ${{ vars.UPLOAD_TAG_ASSETS || 'true' }}
    strategy:
      fail-fast: false
      matrix:
        region: [RoW, NA]
        variant: [headless]

    steps:
      - name: Make room for Linux image assembly
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0  # need tags/commits for versioning

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tachyon-dist-tools
        env:
          DIST_TOOLS_VERSION: ${{ vars.DIST_TOOLS_VERSION || '1.0.4' }}
        run: |
          set -euo pipefail
          pip install "https://github.com/particle-iot/tachyon-dist-tools/releases/download/${DIST_TOOLS_VERSION}/tachyon_dist_tools-${DIST_TOOLS_VERSION}-py3-none-any.whl"

      - name: Determine version
        id: ver
        shell: bash
        env:
          GH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$GH_REF" == refs/tags/* ]]; then
            VERSION=$(python3 scripts/qli/release-version.py current --ref "$GH_REF")
            IS_RELEASE="true"
          else
            VERSION=$(python3 scripts/qli/release-version.py prerelease)
            IS_RELEASE="false"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_release=${IS_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "Resolved qli-2.0 version: ${VERSION} (is_release=${IS_RELEASE})"

      - name: Validate QLI source
        run: make test_qli

      - name: Prepare pinned Kigen LPA RPM
        env:
          GH_TOKEN: ${{ secrets.KIGEN_SDK_TOKEN }}
        run: |
          set -euo pipefail
          make check_qli_packages docker/qli
          mkdir -p .tmp/qli/lpa .tmp/qli/input/rpms
          readarray -t pin < <(python3 - <<'PYLPA'
          import json
          config = json.load(open('versions.json'))['lpa']
          for key in ('repository', 'version', 'filename'):
              print(config[key])
          PYLPA
          )
          gh release download "${pin[1]}" --repo "${pin[0]}" --pattern "${pin[2]}" --dir .tmp/qli/lpa
          docker run --rm --platform linux/arm64 --user root \
            -v "$PWD:/project:ro" -v "$PWD/.tmp/qli/input/rpms:/output" \
            tachyon-system-image-builder:qli-2.0-3 \
            python3 /project/scripts/qli/package-lpa.py /project/versions.json /output \
            --binary "/project/.tmp/qli/lpa/${pin[2]}"
          python3 - <<'PYLPA'
          import hashlib, json, pathlib
          package = next(p for p in json.load(open('versions.json'))['rpm_packages'] if p['name'] == 'particle-kigen-lpa')
          path = pathlib.Path('.tmp/qli/input/rpms') / package['filename']
          if hashlib.file_digest(path.open('rb'), 'sha256').hexdigest() != package['sha256']:
              raise SystemExit('Built Kigen RPM differs from the reviewed artifact lock')
          PYLPA

      - name: Build Qualcomm Linux image
        id: build_step
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          REGION: ${{ matrix.region }}
        run: |
          set -euo pipefail
          make build_qli INPUT_REGION="$REGION" QLI_OUTPUT_VERSION="$VERSION"
          OUTNAME="tachyon-qli-2.0-${REGION}-headless-formfactor_dvt-${VERSION}.zip"
          OUTPUT_PATH=".tmp/qli/output/${OUTNAME}"
          python3 scripts/qli/flash.py "$OUTPUT_PATH" --check-only
          test -s "${OUTPUT_PATH}.sha256"
          for suffix in manifest.json flash-layout.json package-validation.json; do
            test -s "${OUTPUT_PATH%.zip}.${suffix}"
          done
          URL_ENCODED="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$OUTNAME")"
          echo "output_name=${OUTNAME}" >> "$GITHUB_OUTPUT"
          echo "output_path=${OUTPUT_PATH}" >> "$GITHUB_OUTPUT"
          echo "output_stem=${OUTPUT_PATH%.zip}" >> "$GITHUB_OUTPUT"
          echo "url_encoded_name=${URL_ENCODED}" >> "$GITHUB_OUTPUT"

      - name: Upload flashable Linux image
        id: image_artifact
        uses: actions/upload-artifact@v4
        with:
          name: qli-2.0-${{ matrix.region }}-headless
          path: |
            ${{ steps.build_step.outputs.output_path }}
            ${{ steps.build_step.outputs.output_path }}.sha256
            ${{ steps.build_step.outputs.output_stem }}.manifest.json
            ${{ steps.build_step.outputs.output_stem }}.flash-layout.json
            ${{ steps.build_step.outputs.output_stem }}.package-validation.json
          if-no-files-found: error
          compression-level: 0
          # The explicitly listed outputs live below .tmp/.
          include-hidden-files: true
          retention-days: 14

      - name: Record candidate download in build summary
        env:
          ARTIFACT_URL: ${{ steps.image_artifact.outputs.artifact-url }}
          VERSION: ${{ steps.ver.outputs.version }}
          REGION: ${{ matrix.region }}
        run: |
          {
            echo "## QLI 2.0 ${REGION} headless image"
            echo "Version: ${VERSION}"
            echo "Source commit: $(git rev-parse HEAD)"
            echo "[Download ZIP, checksum and validation reports](${ARTIFACT_URL})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify artifact exists
        env:
          OUTPUT_PATH: ${{ steps.build_step.outputs.output_path }}
        run: |
          ls -lh "$OUTPUT_PATH"
          test -s "$OUTPUT_PATH"

      # ---------- Prerelease uploads (PR, branch push, or dispatch) ----------
      # Any non-release build (is_release != true) publishes to prerelease/. This
      # covers PRs, pushes to the qli-2.0 branch, and manual dispatch -- all of which
      # must upload so publish_metadata has artifacts to assemble. Fork PRs are
      # excluded (no credentials).
      - name: Configure AWS (prerelease)
        if: steps.ver.outputs.is_release != 'true' &&
            (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
            env.UPLOAD_PR_ASSETS != 'false'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: tachyon-pr-upload-${{ github.run_id }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload prerelease build to S3
        id: s3_upload_pr
        if: steps.ver.outputs.is_release != 'true' &&
            (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
            env.UPLOAD_PR_ASSETS != 'false'
        env:
          S3_BUCKET: ${{ secrets.LINUX_DIST_S3_BUCKET }}
          OBJ_KEY: "prerelease/${{ steps.build_step.outputs.output_name }}"
          OUTPUT_PATH: ${{ steps.build_step.outputs.output_path }}
        run: |
          set -euo pipefail
          aws s3 cp "$OUTPUT_PATH" "s3://${S3_BUCKET}/${OBJ_KEY}" --only-show-errors
          aws s3 cp "${OUTPUT_PATH}.sha256" "s3://${S3_BUCKET}/${OBJ_KEY}.sha256" --only-show-errors
          for suffix in manifest.json flash-layout.json package-validation.json; do
            aws s3 cp "${OUTPUT_PATH%.zip}.${suffix}" "s3://${S3_BUCKET}/${OBJ_KEY%.zip}.${suffix}" --only-show-errors
          done
          echo "s3_uri=s3://${S3_BUCKET}/${OBJ_KEY}" >> "$GITHUB_OUTPUT"

      - name: Comment with candidate downloads
        if: always() && steps.image_artifact.outputs.artifact-url &&
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ steps.image_artifact.outputs.artifact-url }}
          PUBLIC_URL: https://linux-dist.particle.io/prerelease/${{ steps.build_step.outputs.url_encoded_name }}
          S3_URI: ${{ steps.s3_upload_pr.outputs.s3_uri }}
          REGION: ${{ matrix.region }}
          VERSION: ${{ steps.ver.outputs.version }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const { ARTIFACT_URL, PUBLIC_URL, S3_URI, REGION, VERSION, SOURCE_SHA } = process.env;
            const marker = `<!-- qli-candidate-${REGION} -->`;
            const lines = [marker, `### QLI 2.0 ${REGION} headless candidate`,
              `Source commit: ${SOURCE_SHA}`, `Version: ${VERSION}`,
              `[GitHub artifact: image ZIP, SHA-256, manifest, flash layout and package validation](${ARTIFACT_URL}) (retained for 14 days).`];
            if (S3_URI) {
              const stem = PUBLIC_URL.replace(/\.zip$/, '');
              lines.push(`[Download flashable ZIP](${PUBLIC_URL}) · [SHA-256](${PUBLIC_URL}.sha256)`,
                `[Manifest](${stem}.manifest.json) · [Flash layout](${stem}.flash-layout.json) · [Package validation](${stem}.package-validation.json)`);
            } else {
              lines.push('S3 upload was disabled or did not complete; use the GitHub artifact above.');
            }
            lines.push('Composition and archive checks passed. Flash/setup and hardware acceptance are separate checks.');
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number });
            const previous = comments.find(c => c.user.login === 'github-actions[bot]' && c.body.includes(marker));
            const body = lines.join('\n\n');
            if (previous) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }

      - name: Invalidate CloudFront (optional for PR)
        if: steps.s3_upload_pr.outputs.s3_uri &&
            env.UPLOAD_PR_ASSETS != 'false'
        env:
          CF_DIST_ID: ${{ secrets.LINUX_DIST_CLOUDFRONT_DISTRIBUTION_ID }}
          INVALIDATION_PATHS: "/prerelease/${{ steps.build_step.outputs.output_name }}"
        run: |
          if [ -n "${CF_DIST_ID}" ]; then
            aws cloudfront create-invalidation --distribution-id "$CF_DIST_ID" --paths "$INVALIDATION_PATHS"
          else
            echo "CF_DIST_ID not set; skipping invalidation."
          fi

      # ---------- Tag uploads (permanent) ----------
      - name: Configure AWS (tag)
        if: steps.ver.outputs.is_release == 'true' &&
            env.UPLOAD_TAG_ASSETS != 'false'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: tachyon-tag-upload-${{ github.run_id }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload tag build to S3 (permanent)
        id: s3_upload_tag
        if: steps.ver.outputs.is_release == 'true' &&
            env.UPLOAD_TAG_ASSETS != 'false'
        env:
          S3_BUCKET: ${{ secrets.LINUX_DIST_S3_BUCKET }}
          OBJ_KEY: "releases/${{ steps.ver.outputs.version }}/${{ matrix.region }}/${{ steps.build_step.outputs.output_name }}"
          OUTPUT_PATH: ${{ steps.build_step.outputs.output_path }}
        run: |
          aws s3 cp "$OUTPUT_PATH" "s3://${S3_BUCKET}/${OBJ_KEY}" --only-show-errors
          echo "s3_uri=s3://${S3_BUCKET}/${OBJ_KEY}" >> "$GITHUB_OUTPUT"
          echo "obj_key=${OBJ_KEY}" >> "$GITHUB_OUTPUT"

      - name: Invalidate CloudFront (tags)
        if: steps.s3_upload_tag.outputs.s3_uri && env.UPLOAD_TAG_ASSETS != 'false'
        env:
          CF_DIST_ID: ${{ secrets.LINUX_DIST_CLOUDFRONT_DISTRIBUTION_ID }}
          INVALIDATION_PATHS: "/releases/${{ steps.ver.outputs.version }}/${{ matrix.region }}/${{ steps.build_step.outputs.output_name }}"
        run: |
          if [ -n "${CF_DIST_ID}" ]; then
            aws cloudfront create-invalidation --distribution-id "$CF_DIST_ID" --paths "$INVALIDATION_PATHS"
          else
            echo "CF_DIST_ID not set; skipping invalidation."
          fi

      - name: Compute SHA256
        id: sha
        shell: bash
        env:
          OUTPUT_PATH: ${{ steps.build_step.outputs.output_path }}
        run: |
          set -euo pipefail
          SHA="$(sha256sum "$OUTPUT_PATH" | awk '{print $1}')"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      # Emit region metadata for every successful build (consumed by publish_metadata job)
      - name: Publish region metadata
        if: steps.s3_upload_tag.outputs.s3_uri || steps.s3_upload_pr.outputs.s3_uri
        env:
          IS_RELEASE: ${{ steps.ver.outputs.is_release }}
          VERSION: ${{ steps.ver.outputs.version }}
          REGION: ${{ matrix.region }}
          VARIANT: ${{ matrix.variant }}
          OUTPUT_NAME: ${{ steps.build_step.outputs.output_name }}
          S3_BUCKET: ${{ secrets.LINUX_DIST_S3_BUCKET }}
          SHA256: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p release_meta
          if [[ "$IS_RELEASE" == "true" ]]; then
            S3_KEY="releases/${VERSION}/${REGION}/${OUTPUT_NAME}"
          else
            S3_KEY="prerelease/${OUTPUT_NAME}"
          fi
          cat > "release_meta/${REGION}-${VARIANT}.txt" <<EOF
          REGION=${REGION}
          VARIANT=${VARIANT}
          VERSION=${VERSION}
          IS_RELEASE=${IS_RELEASE}
          FILE=${OUTPUT_NAME}
          S3_KEY=${S3_KEY}
          S3_URI=s3://${S3_BUCKET}/${S3_KEY}
          SHA256=${SHA256}
          EOF

      - name: Upload build metadata artifact
        if: steps.s3_upload_tag.outputs.s3_uri || steps.s3_upload_pr.outputs.s3_uri
        uses: actions/upload-artifact@v4
        with:
          name: build-metadata-${{ matrix.region }}-${{ matrix.variant }}
          path: release_meta/*.txt
          if-no-files-found: ignore
          retention-days: 3

  # ── Per-version metadata (all builds except fork PRs) ──────────────────
  publish_metadata:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    if: >-
      needs.build.result == 'success'
      && ((needs.build.outputs.is_release == 'true' && vars.UPLOAD_TAG_ASSETS != 'false')
          || (needs.build.outputs.is_release != 'true' && vars.UPLOAD_PR_ASSETS != 'false'))
      && !(github.event_name == 'pull_request'
           && github.event.pull_request.head.repo.full_name != github.repository)
    env:
      LINUX_DIST_S3_BUCKET: ${{ secrets.LINUX_DIST_S3_BUCKET }}
      AWS_REGION:           ${{ secrets.AWS_REGION }}
      PUBLIC_RELEASE_BASE_URL:    https://linux-dist.particle.io/releases
      PUBLIC_PRERELEASE_BASE_URL: ${{ vars.PUBLIC_PRERELEASE_BASE_URL || 'https://linux-dist.particle.io/prerelease' }}
    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: tachyon-metadata-${{ github.run_id }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tachyon-dist-tools
        env:
          DIST_TOOLS_VERSION: ${{ vars.DIST_TOOLS_VERSION || '1.0.4' }}
        run: |
          set -euo pipefail
          pip install "https://github.com/particle-iot/tachyon-dist-tools/releases/download/${DIST_TOOLS_VERSION}/tachyon_dist_tools-${DIST_TOOLS_VERSION}-py3-none-any.whl"

      - name: Download build metadata artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-metadata-*
          path: build_meta
          merge-multiple: true

      - name: Ensure all region/variant builds produced metadata
        run: |
          set -euo pipefail
          ls -l build_meta/
          test -f build_meta/NA-headless.txt
          test -f build_meta/RoW-headless.txt

      - name: Assemble and validate metadata
        id: assemble
        env:
          VERSION: ${{ needs.build.outputs.version }}
          IS_RELEASE: ${{ needs.build.outputs.is_release }}
        run: |
          set -euo pipefail
          NOW="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          for TXTFILE in build_meta/*.txt; do
            eval "$(sed 's/^[[:space:]]*//' "$TXTFILE")"
            BASENAME="$(basename "$TXTFILE" .txt)"

            ENCODED_FILE="$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "$FILE")"
            if [[ "$IS_RELEASE" == "true" ]]; then
              URL="${PUBLIC_RELEASE_BASE_URL}/${VERSION}/${REGION}/${ENCODED_FILE}"
            else
              URL="${PUBLIC_PRERELEASE_BASE_URL}/${ENCODED_FILE}"
            fi

            jq -n --arg ver "$VERSION" --arg now "$NOW" --arg url "$URL" \
              --arg sha "$SHA256" --arg variant "$VARIANT" --arg region "$REGION" \
              '{
                release_name: ("tachyon-qli-2.0-" + $region + "-" + $variant + "-formfactor_dvt-" + $ver),
                version: $ver, region: $region, variant: $variant,
                platform: "qcm6490", board: "formfactor_dvt",
                os: "linux", distribution: "qualcomm-linux",
                distribution_version: "2.0", distribution_variant: "open",
                build_date: $now,
                artifacts: [{ artifact_url: $url, sha256_checksum: $sha, type: "release_image" }]
              }' > "build_meta/${BASENAME}.json"
          done

          jq -n --arg schema "https://linux-dist.particle.io/schema/release_metadata_v1.json" \
            --slurpfile builds <(jq -s '.' build_meta/*.json) \
            '{ "$schema": $schema, "builds": $builds[0] }' > release_metadata.json

          tachyon-json-validator release_metadata.json
          echo "Metadata:"
          jq -C . release_metadata.json
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_release=${IS_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "metadata_key=meta/tachyon-${VERSION}.json" >> "$GITHUB_OUTPUT"

      - name: Upload per-version metadata to S3
        env:
          METADATA_KEY: ${{ steps.assemble.outputs.metadata_key }}
          IS_RELEASE: ${{ steps.assemble.outputs.is_release }}
        run: |
          set -euo pipefail
          aws s3 cp release_metadata.json \
            "s3://${LINUX_DIST_S3_BUCKET}/${METADATA_KEY}" \
            --content-type application/json --only-show-errors

          # Expire PR metadata through the existing prerelease lifecycle policy.
          # Tagged release metadata remains permanent.
          if [[ "$IS_RELEASE" != "true" ]]; then
            aws s3api put-object-tagging \
              --bucket "$LINUX_DIST_S3_BUCKET" \
              --key "$METADATA_KEY" \
              --tagging 'TagSet=[{Key=lifecycle,Value=prerelease}]'
            echo "Tagged ${METADATA_KEY} with lifecycle=prerelease"
          fi

      - name: Invalidate CloudFront for metadata
        env:
          CF_DIST_ID: ${{ secrets.LINUX_DIST_CLOUDFRONT_DISTRIBUTION_ID }}
          METADATA_KEY: ${{ steps.assemble.outputs.metadata_key }}
        run: |
          set -euo pipefail
          if [ -n "${CF_DIST_ID:-}" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "$CF_DIST_ID" \
              --paths "/${METADATA_KEY}"
          else
            echo "CF_DIST_ID not set; skipping invalidation."
          fi

      - name: Upload metadata as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata-json
          path: release_metadata.json
          retention-days: 30

  # Publish versioned QLI releases and the dedicated QLI channel.
  publish_release:
    needs: [build, publish_metadata]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: write
      id-token: write
    if: >-
      needs.build.result == 'success'
      && needs.publish_metadata.result == 'success'
      && startsWith(github.ref, 'refs/tags/')
    env:
      # Merge this release into latest; stable is promoted separately.
      PUSH_LATEST_JSON:     ${{ vars.PUSH_LATEST_JSON || 'true' }}
      LINUX_DIST_S3_BUCKET: ${{ secrets.LINUX_DIST_S3_BUCKET }}
      AWS_REGION:           ${{ secrets.AWS_REGION }}
      # Retain the dedicated QLI channel for existing clients.
      PUSH_QLI_JSON:      ${{ vars.PUSH_QLI_JSON || 'true' }}
    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: tachyon-release-${{ github.run_id }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tachyon-dist-tools
        env:
          DIST_TOOLS_VERSION: ${{ vars.DIST_TOOLS_VERSION || '1.0.4' }}
        run: |
          set -euo pipefail
          pip install "https://github.com/particle-iot/tachyon-dist-tools/releases/download/${DIST_TOOLS_VERSION}/tachyon_dist_tools-${DIST_TOOLS_VERSION}-py3-none-any.whl"

      - name: Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-metadata-json
          path: .

      - name: Determine released version
        id: rel
        env:
          TAG_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Tag is 'qli-2.0/x.y.z'. VERSION is clean semver for display; TAG_REF is the
          # actual git ref for the changelog range and the GitHub Release tag.
          VERSION="${TAG_REF#qli-2.0/}"
          echo "version=${VERSION}"   >> "$GITHUB_OUTPUT"
          echo "tag_ref=${TAG_REF}"   >> "$GITHUB_OUTPUT"
          echo "Releasing qli-2.0 ${VERSION} (tag ${TAG_REF})"

      - name: Resolve previous version
        id: versel
        run: |
          set -euo pipefail
          PREV=$(python3 scripts/qli/release-version.py previous)
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"

      - name: Build changelog from PRs
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          fromTag: ${{ steps.versel.outputs.prev }}
          toTag:   ${{ steps.rel.outputs.tag_ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute contributors between tags
        id: contribs
        env:
          FROM_TAG: ${{ steps.versel.outputs.prev }}
          TO_TAG: ${{ steps.rel.outputs.tag_ref }}
        run: |
          set -euo pipefail
          FROM="$FROM_TAG"
          TO="$TO_TAG"

          if [[ -z "$FROM" ]]; then
            RANGE="$TO"
          else
            RANGE="$FROM..$TO"
          fi

          git fetch --quiet --tags --force

          MAP="$(git shortlog -sne $RANGE || true)"
          if [[ -z "$MAP" ]]; then
            LIST="(none)"
          else
            LIST="$(echo "$MAP" | sed -E 's/^[[:space:]]*([0-9]+)[[:space:]]+(.+) <.*>/- \2 (\1 commits)/')"
          fi

          {
            echo 'contributors<<EOF'
            echo "$LIST"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build release body
        id: body
        env:
          VERSION: ${{ steps.rel.outputs.version }}
          TAG_REF: ${{ steps.rel.outputs.tag_ref }}
          PREV: ${{ steps.versel.outputs.prev }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
          GH_REPO: ${{ github.repository }}
          CONTRIBUTORS: ${{ steps.contribs.outputs.contributors }}
        run: |
          set -euo pipefail
          # release_metadata.json here contains only qli-2.0 builds (this branch builds
          # one series), so no filtering is needed before the note builder.
          tachyon-gh-note-builder release_metadata.json -o images_section.md

          CLEAN_CHANGES="$(printf '%s\n' "$CHANGELOG" \
            | sed -E '/^##[[:space:]].*$/d')"

          {
            echo "Qualcomm Linux 2.0 — ${VERSION}"
            echo
            cat images_section.md
            echo
            echo "## What's Changed"
            echo
            if [ -z "$(printf '%s' "$CLEAN_CHANGES" | sed '/^[[:space:]]*$/d')" ]; then
              echo "- No categorized changes"
            else
              printf '%s\n' "$CLEAN_CHANGES"
            fi
            echo
            echo "**Full Changelog**: https://github.com/${GH_REPO}/compare/${PREV:-0.0.0}...${TAG_REF}"
            echo
            echo "Contributors"
            echo "$CONTRIBUTORS"
          } > RELEASE_BODY.md

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag_ref }}
          name: Qualcomm Linux 2.0 ${{ steps.rel.outputs.version }}
          body_path: RELEASE_BODY.md
          draft: false
          prerelease: ${{ contains(steps.rel.outputs.version, '-') }}
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update shared latest release metadata
        if: env.PUSH_LATEST_JSON == 'true'
        env:
          LATEST_KEY: 'meta/tachyon-latest.json'
          CF_DIST_ID: ${{ secrets.LINUX_DIST_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          tachyon-update-published-metadata \
            "$LINUX_DIST_S3_BUCKET" "$LATEST_KEY" release_metadata.json \
            --origin_key distribution --origin "qualcomm-linux"
          if [ -n "${CF_DIST_ID:-}" ]; then
            aws cloudfront create-invalidation --distribution-id "$CF_DIST_ID" \
              --paths "/${LATEST_KEY}"
          fi

      - name: Publish QLI channel metadata
        if: env.PUSH_QLI_JSON == 'true'
        env:
          PREVIEW_KEY: 'meta/tachyon-qli-latest.json'
          CF_DIST_ID: ${{ secrets.LINUX_DIST_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          aws s3 cp release_metadata.json \
            "s3://${LINUX_DIST_S3_BUCKET}/${PREVIEW_KEY}" \
            --content-type application/json --only-show-errors
          echo "published QLI channel metadata -> ${PREVIEW_KEY}"
          if [ -n "${CF_DIST_ID:-}" ]; then
            aws cloudfront create-invalidation --distribution-id "$CF_DIST_ID" \
              --paths "/${PREVIEW_KEY}"
          fi

      - name: QLI channel disabled
        if: env.PUSH_QLI_JSON != 'true'
        run: echo "PUSH_QLI_JSON != 'true' -- QLI channel metadata not updated."
