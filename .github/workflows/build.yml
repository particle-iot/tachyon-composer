name: Build Tachyon 24.04

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
  workflow_run:
    workflows: ["Tag on PR Merge"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-tachyon
    environment: production
    env:
      UPLOAD_PR_ASSETS:  ${{ vars.UPLOAD_PR_ASSETS  || 'true' }}
      UPLOAD_TAG_ASSETS: ${{ vars.UPLOAD_TAG_ASSETS || 'true' }}
    strategy:
      fail-fast: false
      matrix:
        region: [RoW, NA]

    steps:
      - name: Free up disk space
        run: |
          echo "Before:"; df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          echo "After:"; df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need tags/commits for versioning

      # If triggered by the tag workflow finishing, resolve and switch to the newest semver tag
      - name: Detect latest semver tag (only for workflow_run)
        id: tagpick
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          TAG="$(git tag -l --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+(-.*)?$' | head -n1 || true)"
          if [[ -z "${TAG}" ]]; then
            echo "No semver tag found; aborting." >&2
            exit 1
          fi
          echo "Resolved latest tag: ${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Switch to resolved tag (workflow_run)
        if: steps.tagpick.outputs.tag
        shell: bash
        run: |
          set -euo pipefail
          git checkout "refs/tags/${{ steps.tagpick.outputs.tag }}"
          echo "Now at:"
          git log -1 --oneline

      - name: Determine version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          LATEST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo '0.0.0')"
          BASE_VER="${LATEST_TAG#v}"
          SHORTSHA="$(git rev-parse --short=7 HEAD)"

          if [[ -n "${{ steps.tagpick.outputs.tag }}" ]]; then
            MODE="tag"
            VERSION="${{ steps.tagpick.outputs.tag }}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            MODE="pr"
            VERSION="${BASE_VER}-${SHORTSHA}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            MODE="tag"
            VERSION="${{ github.ref_name }}"
          else
            MODE="other"
            VERSION="${BASE_VER}-${SHORTSHA}"
          fi

          echo "base_tag=${BASE_VER}"  >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORTSHA}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}"    >> "$GITHUB_OUTPUT"
          echo "mode=${MODE}"          >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION} (mode=${MODE})"

      - name: Build (Ubuntu 24.04)
        id: build_step
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.ver.outputs.mode }}" == "pr" || "${{ steps.ver.outputs.mode }}" == "other" ]]; then
            OUTNAME="tachyon-ubuntu-24.04-${{ matrix.region }}-desktop-${{ steps.ver.outputs.base_tag }}-${{ steps.ver.outputs.short_sha }}.zip"
          else
            # tag / workflow_run(tag)
            OUTNAME="tachyon-ubuntu-24.04-${{ matrix.region }}-desktop-${{ steps.ver.outputs.version }}.zip"
          fi

          make build_24.04 \
            VERSIONS_FILE=./versions.json \
            INPUT_REGION=${{ matrix.region }} \
            INPUT_VARIANT=desktop \
            OUTPUT_VERSION=${{ steps.ver.outputs.version }} \
            OUTPUT_24_04_SYSTEM_IMAGE="${OUTNAME}"

          echo "output_name=${OUTNAME}" >> "$GITHUB_OUTPUT"
          echo "output_path=.tmp/output/${OUTNAME}" >> "$GITHUB_OUTPUT"

      - name: Verify artifact exists
        run: |
          ls -lh "${{ steps.build_step.outputs.output_path }}"
          test -s "${{ steps.build_step.outputs.output_path }}"

      # ---------- PR uploads ----------
      - name: Configure AWS (PR)
        if: github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            env.UPLOAD_PR_ASSETS != 'false'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: tachyon-pr-upload-${{ github.run_id }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload PR build to S3
        id: s3_upload_pr
        if: github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            env.UPLOAD_PR_ASSETS != 'false'
        env:
          S3_BUCKET: ${{ secrets.LINUX_DIST_S3_BUCKET }}
          OBJ_KEY: "${{ steps.build_step.outputs.output_name }}"
        run: |
          aws s3 cp "${{ steps.build_step.outputs.output_path }}" "s3://${S3_BUCKET}/${OBJ_KEY}" --only-show-errors
          echo "s3_uri=s3://${S3_BUCKET}/${OBJ_KEY}" >> "$GITHUB_OUTPUT"

      - name: Presign PR artifact
        id: presign_pr
        if: steps.s3_upload_pr.outputs.s3_uri &&
            github.event_name == 'pull_request' &&
            env.UPLOAD_PR_ASSETS != 'false'
        env:
          S3_BUCKET: ${{ secrets.LINUX_DIST_S3_BUCKET }}
          OBJ_KEY: "${{ steps.build_step.outputs.output_name }}"
        run: |
          URL="$(aws s3 presign "s3://${S3_BUCKET}/${OBJ_KEY}" --expires-in 604800)"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Comment with download link (peter-evans)
        if: steps.presign_pr.outputs.url &&
            github.event_name == 'pull_request' &&
            env.UPLOAD_PR_ASSETS != 'false'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ✅ **PR build uploaded** for **${{ matrix.region }} desktop**

            **File:** `${{ steps.build_step.outputs.output_name }}`
            **Base tag:** `${{ steps.ver.outputs.base_tag }}`
            **Commit:** `${{ steps.ver.outputs.short_sha }}`

            **Download:** [Presigned URL](${{ steps.presign_pr.outputs.url }}) _(expires in ~7 days)_

      - name: Invalidate CloudFront (optional for PR)
        if: steps.s3_upload_pr.outputs.s3_uri &&
            env.UPLOAD_PR_ASSETS != 'false'
        env:
          CF_DIST_ID: ${{ secrets.LINUX_DIST_CLOUDFRONT_DISTRIBUTION_ID }}
          INVALIDATION_PATHS: "/${{ steps.build_step.outputs.output_name }}"
        run: |
          if [ -n "${CF_DIST_ID}" ]; then
            aws cloudfront create-invalidation --distribution-id "$CF_DIST_ID" --paths "$INVALIDATION_PATHS"
          else
            echo "CF_DIST_ID not set; skipping invalidation."
          fi

      # ---------- Tag uploads (permanent) ----------
      - name: Configure AWS (tag)
        if: (startsWith(github.ref, 'refs/tags/') || steps.tagpick.outputs.tag) &&
            env.UPLOAD_TAG_ASSETS != 'false'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: tachyon-tag-upload-${{ github.run_id }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Compute object version (for tag uploads)
        id: objver
        if: startsWith(github.ref, 'refs/tags/') || steps.tagpick.outputs.tag
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ steps.tagpick.outputs.tag }}" ]; then
            echo "obj_ver=${{ steps.tagpick.outputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "obj_ver=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload tag build to S3 (permanent)
        id: s3_upload_tag
        if: (startsWith(github.ref, 'refs/tags/') || steps.tagpick.outputs.tag) &&
            env.UPLOAD_TAG_ASSETS != 'false'
        env:
          S3_BUCKET: ${{ secrets.LINUX_DIST_S3_BUCKET }}
          OBJ_VER: ${{ steps.objver.outputs.obj_ver }}
          OBJ_KEY: "releases/${{ env.OBJ_VER }}/${{ matrix.region }}/${{ steps.build_step.outputs.output_name }}"
        run: |
          aws s3 cp "${{ steps.build_step.outputs.output_path }}" "s3://${S3_BUCKET}/${OBJ_KEY}" --only-show-errors
          echo "region=${{ matrix.region }}"     >> "$GITHUB_OUTPUT"
          echo "file=${{ steps.build_step.outputs.output_name }}" >> "$GITHUB_OUTPUT"
          echo "obj_key=${OBJ_KEY}"             >> "$GITHUB_OUTPUT"
          echo "s3_uri=s3://${S3_BUCKET}/${OBJ_KEY}" >> "$GITHUB_OUTPUT"

      - name: Invalidate CloudFront (optional for tags)
        if: steps.s3_upload_tag.outputs.s3_uri &&
            env.UPLOAD_TAG_ASSETS != 'false'
        env:
          CF_DIST_ID: ${{ secrets.LINUX_DIST_CLOUDFRONT_DISTRIBUTION_ID }}
          OBJ_VER: ${{ steps.objver.outputs.obj_ver }}
          INVALIDATION_PATHS: "/releases/${{ env.OBJ_VER }}/${{ matrix.region }}/${{ steps.build_step.outputs.output_name }}"
        run: |
          if [ -n "${CF_DIST_ID}" ]; then
            aws cloudfront create-invalidation --distribution-id "$CF_DIST_ID" --paths "$INVALIDATION_PATHS"
          else
            echo "CF_DIST_ID not set; skipping invalidation."
          fi

      # Emit tiny region metadata and upload as a shared artifact (for the release job to aggregate)
      - name: Publish region metadata (for release job)
        if: steps.s3_upload_tag.outputs.s3_uri
        run: |
          mkdir -p release_meta
          cat > release_meta/${{ matrix.region }}.txt <<EOF
          REGION=${{ matrix.region }}
          VERSION=${{ steps.ver.outputs.version }}
          FILE=${{ steps.build_step.outputs.output_name }}
          S3_KEY=${{ env.OBJ_KEY }}
          S3_URI=s3://${{ secrets.LINUX_DIST_S3_BUCKET }}/${{ env.OBJ_KEY }}
          EOF

      - name: Upload release metadata artifact
        if: steps.s3_upload_tag.outputs.s3_uri
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: release_meta/*.txt
          if-no-files-found: ignore
          retention-days: 3

  publish_release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Only publish for tag-mode runs (tag push or workflow_run), and when the build matrix succeeded
    if: ${{ needs.build.result == 'success' && (github.event_name == 'workflow_run' || startsWith(github.ref, 'refs/tags/')) }}
    steps:
      - name: Checkout (to get tags for compare link)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download aggregated release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: release_meta

      - name: Parse version and choose previous tag
        id: versel
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -h '^VERSION=' release_meta/*.txt | head -n1 | cut -d= -f2)"
          if [[ -z "$VERSION" ]]; then
            echo "No VERSION in metadata; abort." >&2
            exit 1
          fi

          git fetch --tags --force
          mapfile -t TAGS < <(git tag -l --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+(-.*)?$' || true)
          PREV=""
          for t in "${TAGS[@]}"; do
            if [[ "$t" == "$VERSION" ]]; then
              continue
            fi
            PREV="$t"
            break
          done

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prev=${PREV}"     >> "$GITHUB_OUTPUT"

      - name: Build release body
        id: body
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.versel.outputs.version }}"
          PREV="${{ steps.versel.outputs.prev }}"

          NA_FILE="$(grep -h '^FILE=' release_meta/NA.txt   | cut -d= -f2 || true)"
          ROW_FILE="$(grep -h '^FILE=' release_meta/RoW.txt | cut -d= -f2 || true)"

          {
            echo "${VERSION}"
            echo
            echo "Images"
            echo
            if [[ -n "$NA_FILE" ]]; then
              echo "NA"
              echo
              echo "Tachyon desktop - ${NA_FILE}"
              echo
            fi
            if [[ -n "$ROW_FILE" ]]; then
              echo "RoW"
              echo
              echo "Tachyon desktop - ${ROW_FILE}"
              echo
            fi
            echo
            echo "<list of changes - this is a meta tag>"
            echo
            echo "Full Changelog: ${PREV:-0.0.0}...${VERSION}"
            echo
            echo "Contributors"
            echo " x,"
            echo
            echo " y, z"
          } > RELEASE_BODY.md

          echo "Built RELEASE_BODY.md:"
          sed -n '1,200p' RELEASE_BODY.md

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versel.outputs.version }}
          name: ${{ steps.versel.outputs.version }}
          body_path: RELEASE_BODY.md
          draft: false
          prerelease: ${{ contains(steps.versel.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}