# WirePlumber 0.5: use the validated headless UCM routes. The generic Pro Audio
# profile probes every PCM, including disconnected DP, and logs codec errors.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.platform-sound" } ]
    actions = {
      update-props = {
        device.description = "Tachyon"
        api.alsa.use-ucm = true
        api.acp.disable-pro-audio = true
      }
    }
  }
]
