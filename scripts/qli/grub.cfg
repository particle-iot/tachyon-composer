set default=0
set timeout=3
search --no-floppy --file /boot/vmlinuz --set=root
menuentry 'QLI 2.0 Open (Tachyon / Particle 6.8)' {
    # The current EFI map lets KASLR place the kernel in the DT's modem RMTFS
    # carveout. Use the tested fixed placement until firmware reserves it.
    linux /boot/vmlinuz root=PARTLABEL=system rw console=ttyMSM0,115200n8 rootwait nokaslr
    initrd /boot/initrd.img
}
